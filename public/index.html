<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Stop Marketing · Client Portal</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Login screen -->
  <section id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg">
        <img class="brand-logo" src="/assets/logo.png" alt="One Stop Marketing">
        <div class="brand-word"><span>One Stop</span> Marketing</div>
      </div>
      <h1>Client Portal</h1>
      <p class="muted">Sign in to view your marketing results.</p>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </section>

  <!-- App shell -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo.png" alt="One Stop Marketing">
        <div class="brand-word"><span>One Stop</span> Marketing</div>
      </div>
      <div class="topbar-client">
        <span class="muted">Prepared for</span>
        <strong id="client-name">Allied Elite Financial</strong>
      </div>
      <div class="topbar-right">
        <label class="month-pick">Month
          <select id="month-select"></select>
        </label>
        <span id="user-chip" class="chip"></span>
        <button id="logout-btn" class="btn btn-ghost">Sign out</button>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <a href="#/summary" data-tab="summary">Summary</a>
      <a href="#/websites" data-tab="websites">Agent Websites</a>
      <a href="#/socials" data-tab="socials">Social Media</a>
      <a href="#/analytics" data-tab="analytics">Analytics</a>
      <a href="#/managers" data-tab="managers">Sales Manager Pages</a>
      <a href="#/manage" data-tab="manage" class="admin-only">Manage Data</a>
    </nav>
    <main id="main" class="container"></main>
    <footer class="footer">Reporting by <strong>One Stop Marketing</strong> for Allied Elite Financial</footer>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>

  <script src="/vendor/chart.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
